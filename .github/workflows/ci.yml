name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts is gitignored but listed in tsconfig include.
      # An empty file satisfies TypeScript without needing a full build.
      - name: Create next-env.d.ts
        run: touch next-env.d.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
