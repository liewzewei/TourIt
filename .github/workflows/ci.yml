name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # next-env.d.ts is gitignored but listed in tsconfig include.
      # An empty file satisfies TypeScript without needing a full build.
      - name: Create next-env.d.ts
        run: touch next-env.d.ts

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs the app against a real Supabase stack started locally inside the
    # runner, so E2E exercises the actual migrations, RLS, and seed data with no
    # effect on any hosted project. Gated behind the cheap checks and PR-only
    # because spinning the stack up is slow.
    needs: [ci, test-unit]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start local Supabase (applies migrations + seed)
        run: supabase start

      - name: Run database tests (pgTAP)
        run: supabase test db

      - name: Export local Supabase keys into the job env
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          anon=$(grep -m1 '^ANON_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          service=$(grep -m1 '^SERVICE_ROLE_KEY=' "$RUNNER_TEMP/supabase.env" | cut -d= -f2- | tr -d '"')
          test -n "$anon" && test -n "$service"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$anon" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$service" >> "$GITHUB_ENV"

      - name: Run E2E tests
        run: npx playwright test
        env:
          # Local stack: fixed URL + a throwaway test account that auth.setup
          # provisions via the admin API. The publishable/secret keys come from
          # the export step above (via $GITHUB_ENV).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          E2E_TEST_EMAIL: e2e@tourit.local
          E2E_TEST_PASSWORD: e2e-ci-password

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
